name: Refine MCP boundary parity

on:
  push:
    branches:
      - feat/mcp-boundary-parity
    paths:
      - scripts/_refine_mcp_boundary.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply refinement
        run: python scripts/_refine_mcp_boundary.py
      - name: Install exact CI formatter
        run: python -m pip install ruff==0.15.1
      - name: Validate formatting
        run: |
          ruff check --fix src/openjarvis/mcp/loader.py src/openjarvis/security/data_boundary_audit.py tests/security/test_data_boundary_audit.py
          ruff format src/openjarvis/mcp/loader.py src/openjarvis/security/data_boundary_audit.py tests/security/test_data_boundary_audit.py
          ruff check src/ tests/
          ruff format --check src/ tests/
          python -m py_compile src/openjarvis/mcp/loader.py src/openjarvis/security/data_boundary_audit.py tests/security/test_data_boundary_audit.py
          git diff --check
      - name: Commit product refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/openjarvis/mcp/loader.py src/openjarvis/security/data_boundary_audit.py tests/security/test_data_boundary_audit.py docs/user-guide/data-boundary-scan.md
          git commit -m "refine(security): tighten MCP boundary diagnostics"
          git push origin HEAD:feat/mcp-boundary-parity
