name: Apply runtime parity polish

on:
  pull_request:
    branches:
      - ci/data-boundary-runtime-parity-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/data-boundary-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-boundary-runtime-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Apply assertion-guarded polish
        run: python scripts/_finalize_data_boundary_runtime_parity.py
      - name: Ruff fix and format touched Python
        run: |
          uvx ruff check --fix \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/core/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
          uvx ruff format \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/core/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
      - name: Validate generated source
        run: |
          python -m py_compile \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/core/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
          git diff --check
      - name: Commit polished files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(scan): finalize import-safe boundary parity"
          git push origin HEAD:fix/data-boundary-runtime-parity
