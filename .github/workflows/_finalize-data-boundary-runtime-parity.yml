name: Finalize data-boundary runtime parity

on:
  push:
    branches:
      - fix/data-boundary-runtime-parity
    paths:
      - scripts/_finalize_data_boundary_runtime_parity.py
      - .github/workflows/_finalize-data-boundary-runtime-parity.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-boundary-runtime-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Apply assertion-guarded finalization
        run: python scripts/_finalize_data_boundary_runtime_parity.py
      - name: Ruff fix and format changed Python
        run: |
          uvx ruff check --fix \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/engine/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
          uvx ruff format \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/engine/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
      - name: Validate generated Python and whitespace
        run: |
          python -m py_compile \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/engine/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py
          git diff --check
      - name: Commit finalized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/cli/test_scan_runtime_parity.py \
            tests/engine/test_cloud_activation.py \
            tests/security/test_data_boundary_runtime_parity.py \
            docs/user-guide/data-boundary-scan.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor(scan): keep runtime boundary metadata import-safe"
          git push origin HEAD:fix/data-boundary-runtime-parity
