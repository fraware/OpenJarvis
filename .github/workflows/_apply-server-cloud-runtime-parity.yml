name: Apply server cloud runtime parity

on:
  push:
    branches:
      - work/server-cloud-runtime-parity

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-parity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/server-cloud-runtime-parity
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Apply assertion-guarded patch
        run: python scripts/_apply_server_cloud_runtime_parity.py
      - name: Ruff fix
        run: >-
          uvx ruff check --fix
          src/openjarvis/core/cloud_activation.py
          src/openjarvis/cli/serve.py
          src/openjarvis/security/data_boundary_audit.py
          tests/core/test_cloud_activation.py
          tests/security/test_data_boundary_audit.py
      - name: Ruff format
        run: >-
          uvx ruff format
          src/openjarvis/core/cloud_activation.py
          src/openjarvis/cli/serve.py
          src/openjarvis/security/data_boundary_audit.py
          tests/core/test_cloud_activation.py
          tests/security/test_data_boundary_audit.py
      - name: Static validation
        run: |
          python -m py_compile \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_cloud_activation.py \
            tests/security/test_data_boundary_audit.py
          git diff --check
      - name: Commit finalized source
        run: |
          git config user.name "fraware"
          git config user.email "113530345+fraware@users.noreply.github.com"
          git add \
            docs/user-guide/data-boundary-scan.md \
            src/openjarvis/core/cloud_activation.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_cloud_activation.py \
            tests/security/test_data_boundary_audit.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(scan): align server cloud activation with runtime [runtime-parity-applied]"
          git push origin HEAD:work/server-cloud-runtime-parity
