name: Scanner inference boundary refine

on:
  push:
    branches:
      - feat/scanner-inference-endpoint-boundaries-work

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-boundary-refined]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Apply guarded migration
        run: python scripts/_apply_scanner_inference_boundaries.py
      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server
      - name: Format and lint candidate
        run: |
          uv run ruff format \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff check --fix \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff format \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
          uv run ruff format --check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
      - name: Targeted tests
        run: |
          uv run pytest -q -m "not live and not cloud and not hub" \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
      - name: Static checks
        run: |
          python -m py_compile \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_inference_endpoint_boundaries.py
          git diff --check
      - name: Persist refined product files
        run: |
          git config user.name repository-maintenance
          git config user.email repository-maintenance@users.noreply.github.com
          git add \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          git commit -m "refactor(scan): share inference endpoint boundaries [scanner-boundary-refined]"
          git push
