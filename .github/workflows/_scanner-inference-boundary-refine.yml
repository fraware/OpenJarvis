name: Scanner inference boundary refine

on:
  push:
    branches:
      - feat/scanner-inference-endpoint-boundaries-work

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-boundary-refined]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Apply guarded migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_apply_scanner_inference_boundaries.py")
          text = path.read_text(encoding="utf-8")
          guard = 'assert "_primary_cloud_signals" not in text\n'
          assert text.count(guard) == 1
          path.write_text(text.replace(guard, "", 1), encoding="utf-8")
          PY
          python scripts/_apply_scanner_inference_boundaries.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/openjarvis/security/data_boundary_audit.py")
          text = path.read_text(encoding="utf-8")
          old = '''    has_cloud = bool(_primary_cloud_signals(config))\n    evidence = "tools.storage.enabled = true"\n    if has_cloud:\n        evidence += "; cloud inference surface detected"\n'''
          new = '''    has_outbound = any(\n        boundary.leaves_local_host is True\n        for _, boundary in _primary_inference_signals(config)\n    )\n    evidence = "tools.storage.enabled = true"\n    if has_outbound:\n        evidence += "; outbound inference surface detected"\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          assert "_primary_cloud_signals" not in text

          wraps = {
              '                potential_data_path="inference request context -> external network endpoint",\n': (
                  '                potential_data_path=(\n'
                  '                    "inference request context -> external network endpoint"\n'
                  '                ),\n'
              ),
              '                potential_data_path="inference request context -> unresolved endpoint boundary",\n': (
                  '                potential_data_path=(\n'
                  '                    "inference request context -> unresolved endpoint boundary"\n'
                  '                ),\n'
              ),
              '            potential_data_path="indexed local memory -> prompt context -> unknown endpoint",\n': (
                  '            potential_data_path=(\n'
                  '                "indexed local memory -> prompt context -> unknown endpoint"\n'
                  '            ),\n'
              ),
              '                "Classify the inference endpoint before injecting sensitive indexed memory."\n': (
                  '                "Classify the inference endpoint before injecting sensitive "\n'
                  '                "indexed memory."\n'
              ),
          }
          for before, after in wraps.items():
              assert text.count(before) == 1, before
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server
      - name: Format and lint candidate
        run: |
          uv run ruff format \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff check --fix \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff format \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          uv run ruff check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
          uv run ruff format --check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
      - name: Targeted tests
        run: |
          uv run pytest -q -m "not live and not cloud and not hub" \
            tests/core/test_inference_boundaries.py \
            tests/security/test_data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py \
            tests/cli/test_scan_data_boundaries.py
      - name: Static checks
        run: |
          python -m py_compile \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_inference_boundaries.py \
            tests/security/test_inference_endpoint_boundaries.py
          git diff --check
      - name: Persist refined product files
        run: |
          git config user.name repository-maintenance
          git config user.email repository-maintenance@users.noreply.github.com
          git add \
            src/openjarvis/security/data_boundary_audit.py \
            tests/security/test_inference_endpoint_boundaries.py
          git commit -m "refactor(scan): share inference endpoint boundaries [scanner-boundary-refined]"
          git push
