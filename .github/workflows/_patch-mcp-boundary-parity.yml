name: Patch MCP boundary parity

on:
  push:
    branches:
      - feat/mcp-boundary-parity
    paths:
      - scripts/_patch_mcp_boundary_parity.py
      - .github/workflows/_patch-mcp-boundary-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply assertion-guarded patch
        run: python scripts/_patch_mcp_boundary_parity.py
      - name: Install exact CI formatter
        run: python -m pip install ruff==0.15.1
      - name: Format and statically validate changed Python
        run: |
          ruff check --fix \
            src/openjarvis/core/mcp_boundaries.py \
            src/openjarvis/mcp/loader.py \
            src/openjarvis/system/builder.py \
            src/openjarvis/server/agent_manager_routes.py \
            src/openjarvis/cli/ask.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_mcp_boundaries.py \
            tests/mcp/test_loader.py \
            tests/security/test_data_boundary_audit.py
          ruff format \
            src/openjarvis/core/mcp_boundaries.py \
            src/openjarvis/mcp/loader.py \
            src/openjarvis/system/builder.py \
            src/openjarvis/server/agent_manager_routes.py \
            src/openjarvis/cli/ask.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_mcp_boundaries.py \
            tests/mcp/test_loader.py \
            tests/security/test_data_boundary_audit.py
          ruff check src/ tests/
          ruff format --check src/ tests/
          python -m py_compile \
            src/openjarvis/core/mcp_boundaries.py \
            src/openjarvis/mcp/loader.py \
            src/openjarvis/system/builder.py \
            src/openjarvis/server/agent_manager_routes.py \
            src/openjarvis/cli/ask.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_mcp_boundaries.py \
            tests/mcp/test_loader.py \
            tests/security/test_data_boundary_audit.py
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/openjarvis/core/mcp_boundaries.py \
            src/openjarvis/mcp/loader.py \
            src/openjarvis/system/builder.py \
            src/openjarvis/server/agent_manager_routes.py \
            src/openjarvis/cli/ask.py \
            src/openjarvis/cli/serve.py \
            src/openjarvis/security/data_boundary_audit.py \
            tests/core/test_mcp_boundaries.py \
            tests/mcp/test_loader.py \
            tests/security/test_data_boundary_audit.py
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "feat(security): align MCP transport boundary semantics"
          git push origin HEAD:feat/mcp-boundary-parity
