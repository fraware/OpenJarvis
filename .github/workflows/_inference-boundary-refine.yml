name: Inference boundary refine

on:
  push:
    branches:
      - feat/inference-trust-boundaries-work

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Apply assertion-guarded test updates
        run: python scripts/_apply_inference_boundary_tests.py
      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server
      - name: Format and lint changed Python
        run: |
          uv run ruff check --fix \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
          uv run ruff format \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
          uv run ruff check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
          uv run ruff format --check \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
      - name: Targeted tests
        run: |
          uv run pytest -q \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
      - name: Static checks
        run: |
          python -m py_compile \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
          git diff --check
      - name: Record refined source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name repository-maintenance
          git config user.email repository-maintenance@users.noreply.github.com
          git add \
            src/openjarvis/core/inference_boundaries.py \
            src/openjarvis/engine/_discovery.py \
            tests/core/test_inference_boundaries.py \
            tests/engine/test_boundary_inventory.py \
            tests/engine/test_discovery.py
          git commit -m "refine inference boundary semantics"
          git push
